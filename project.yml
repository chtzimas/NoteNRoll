name: NoteNRoll
options:
  bundleIdPrefix: com.notenroll
  deploymentTarget:
    iOS: "17.0"
packages:
  JournalCore:
    path: JournalCore
  Features:
    path: Features
targets:
  NoteNRoll:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NoteNRoll
    dependencies:
      - package: JournalCore
      - package: Features
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notenroll.app
        PRODUCT_NAME: NoteNRoll
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "NoteNRoll records your voice to transcribe training notes on-device."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "NoteNRoll transcribes your voice notes on-device into training entries."
schemes:
  NoteNRoll:
    build:
      targets:
        NoteNRoll: all
    test:
      targets: []
    run:
      config: Debug
