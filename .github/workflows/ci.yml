name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run JournalCore tests
        run: cd JournalCore && swift test

      - name: Run Features tests
        run: cd Features && swift test

  architecture-check-journalcore:
    name: Retain Cycle Detection (JournalCore)
    runs-on: macos-15
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SwiftAtlas
        uses: chtzimas/SwiftAtlas@v1
        with:
          path: JournalCore
          github-token: ${{ secrets.GITHUB_TOKEN }}

  architecture-check-features:
    name: Retain Cycle Detection (Features)
    runs-on: macos-15
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SwiftAtlas
        uses: chtzimas/SwiftAtlas@v1
        with:
          path: Features
          github-token: ${{ secrets.GITHUB_TOKEN }}
